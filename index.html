/* Layout concept: a chart-room map. Sidebar of listings on the left (bottom sheet on phones),
   an island drawn on a pale sea with a faint lat/long grid; pins coloured by what you eat there. */
:root {
  --sea: #D9E7EA;
  --land: #F7F9F6;
  --coast: #8FAAB1;
  --grid: rgba(18, 48, 58, .08);
  --ink: #12303A;
  --ink-2: #48636D;
  --panel: #FBFCFB;
  --field: #EDF3F3;
  --line: #D3DFE1;
  --accent: #C8321F;
  --on-accent: #FFFFFF;
  --shadow: rgba(18, 48, 58, .18);
  --c-eat: #D8452B;
  --c-breakfast: #D99208;
  --c-drinks: #17917D;
  --c-sweets: #C23F7B;
  --c-markets: #4F5BC8;
  --c-sights: #6B7F8C;
  --font-display: 'Bricolage Grotesque', 'Noto Sans TC', system-ui, sans-serif;
  --font-body: 'DM Sans', 'Noto Sans TC', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sea: #0C1A20; --land: #182A31; --coast: #3B5963; --grid: rgba(220, 240, 245, .06);
    --ink: #E6F0F2; --ink-2: #9DB5BC; --panel: #112028; --field: #1A2E37; --line: #26404A;
    --accent: #FF6B52; --on-accent: #1A0B08; --shadow: rgba(0, 0, 0, .5);
    --c-eat: #FF7456; --c-breakfast: #F2B53A; --c-drinks: #3CC4AC; --c-sweets: #F06CA3;
    --c-markets: #8C97F2; --c-sights: #93A8B4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sea: #0C1A20; --land: #182A31; --coast: #3B5963; --grid: rgba(220, 240, 245, .06);
  --ink: #E6F0F2; --ink-2: #9DB5BC; --panel: #112028; --field: #1A2E37; --line: #26404A;
  --accent: #FF6B52; --on-accent: #1A0B08; --shadow: rgba(0, 0, 0, .5);
  --c-eat: #FF7456; --c-breakfast: #F2B53A; --c-drinks: #3CC4AC; --c-sweets: #F06CA3;
  --c-markets: #8C97F2; --c-sights: #93A8B4;
  color-scheme: dark;
}

html, body { height: 100%; }
body { margin: 0; background: var(--sea); color: var(--ink); font: 14px/1.45 var(--font-body); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.cat-eat { --c: var(--c-eat); }
.cat-breakfast { --c: var(--c-breakfast); }
.cat-drinks { --c: var(--c-drinks); }
.cat-sweets { --c: var(--c-sweets); }
.cat-markets { --c: var(--c-markets); }
.cat-sights { --c: var(--c-sights); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }

#app { position: relative; height: 100%; display: grid; grid-template-columns: clamp(344px, 30vw, 420px) minmax(0, 1fr); }

/* ---------- panel ---------- */
#panel { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel); border-right: 1px solid var(--line); z-index: 800; position: relative; }
.sheet-handle { display: none; }
.head { padding: 18px 16px 12px; display: flex; flex-direction: column; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { flex: none; color: var(--accent); }
.brand-text { min-width: 0; flex: 1; }
.eyebrow { margin: 0; font-size: 11px; letter-spacing: .14em; color: var(--ink-2); font-weight: 500; }
h1 { margin: 0; font: 700 24px/1.1 var(--font-display); letter-spacing: -.01em; text-wrap: balance; }
.total { font: 600 12px var(--font-body); color: var(--ink-2); background: var(--field); border-radius: 999px; padding: 4px 10px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tagline { margin: 0; color: var(--ink-2); max-width: 36ch; }

.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-2); pointer-events: none; }
.search input { width: 100%; box-sizing: border-box; height: 44px; padding: 0 14px 0 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--field); font-size: 16px; }
.search input::placeholder { color: var(--ink-2); opacity: .85; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); white-space: nowrap; font-weight: 500; transition: background .15s, border-color .15s; }
.chip:hover { border-color: var(--c); }
.chip .n { color: var(--ink-2); font-variant-numeric: tabular-nums; font-weight: 400; }

.group { position: sticky; top: 0; z-index: 1; padding: 8px 16px 6px; background: var(--panel); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; border-bottom: 1px solid var(--line); }

    var labelIcon = function (html, cls, w, ax) { return L.divIcon({ className: '', html: '<div class="' + cls + '" style="width:' + w + 'px">' + html + '</div>', iconSize: [w, 16], iconAnchor: [ax, 8] }); };
    [['Taipei 台北', 25.05, 121.52, 'l', 34], ['Hsinchu 新竹', 24.8, 120.95, 'l', 14], ['Taichung 台中', 24.15, 120.64, 'r', 28],
     ['Chiayi 嘉義', 23.36, 120.42, 'r', 20], ['Tainan 台南', 23.0, 120.17, 'r', 14], ['Kaohsiung 高雄', 22.63, 120.26, 'r', 28],
     ['Yilan 宜蘭', 24.75, 121.78, 'r', 14], ['Hualien 花蓮', 23.98, 121.64, 'r', 22], ['Taitung 台東', 22.76, 121.18, 'r', 14]
    ].forEach(function (c) {
      var left = c[3] === 'l';
      L.marker([c[1], c[2]], { icon: labelIcon(c[0], 'city ' + c[3], 120, left ? 120 + c[4] : -c[4]), interactive: false, keyboard: false, pane: 'labels' }).addTo(map);
    });
    [['Taiwan Strait 台灣海峽', 24.2, 119.3], ['Pacific Ocean 太平洋', 23.4, 122.6]].forEach(function (s) {
      L.marker([s[1], s[2]], { icon: labelIcon(s[0], 'sea', 170, 85), interactive: false, keyboard: false, pane: 'labels' }).addTo(map);
    });
    var toggleLabels = function () {
      var z = map.getZoom(), el = map.getContainer();
      el.classList.toggle('hide-labels', z >= 11);
      el.classList.toggle('hide-sea', z >= 10 || el.clientWidth < 600);
    };
    map.on('zoomend resize', toggleLabels);
    toggleLabels();
  }

  /* ---------- markers ---------- */
  var cluster = L.markerClusterGroup({
    showCoverageOnHover: false, maxClusterRadius: 44, disableClusteringAtZoom: 15, spiderfyOnMaxZoom: false,
    iconCreateFunction: function (c) {
      var n = c.getChildCount(), s = n < 10 ? 36 : n < 40 ? 42 : 48;
      return L.divIcon({ html: '<span class="cl">' + n + '</span>', className: 'cl-wrap', iconSize: [s, s] });
    }
  });
  map.addLayer(cluster);

  function linkLabel(u) { return /pixnet|walkerland|blog|article|post/i.test(u) ? 'Review' : 'Website'; }
  function popupHtml(p) {
    var c = catById[p.cat];
    var gm = 'https://www.google.com/maps/search/?api=1&query=' + p.lat + ',' + p.lng;
    var h = '<div class="pop"><p class="pop-kicker cat-' + p.cat + '"><span class="dot"></span>' + esc(c.label) + ' · ' + esc(p.region) + '</p>';
    h += '<h3 class="pop-name">' + esc(p.name) + '</h3>';
    if (p.sub) h += '<p class="pop-sub">' + esc(p.sub) + '</p>';
    if (p.note) h += '<p class="pop-note">' + esc(p.note) + '</p>';
    h += '<div class="pop-actions"><a class="btn btn-main" href="' + gm + '" target="_blank" rel="noopener">Open in Google Maps</a>';
    (p.links || []).filter(function (u) { return /^https?:\/\//i.test(u); }).forEach(function (u) {
      h += '<a class="btn" href="' + esc(u) + '" target="_blank" rel="noopener">' + linkLabel(u) + '</a>';
    });
    return h + '</div></div>';
  }
  var popBottom = function () { return phone.matches ? [16, 182] : [16, 16]; };

  var markers = new Map();
  places.forEach(function (p) {
    var m = L.marker([p.lat, p.lng], {
      icon: L.divIcon({ className: 'pin-wrap cat-' + p.cat, html: '<span class="pin"></span>', iconSize: [24, 24] }),
      title: p.name, alt: p.name, riseOnHover: true
    });
    m.bindPopup(function () { return popupHtml(p); }, { className: 'fm-popup', maxWidth: 300, minWidth: 230, autoPanPaddingTopLeft: [16, 56], autoPanPaddingBottomRight: popBottom() });
    m.on('popupopen', function () { setActive(p.id); });
    m.on('popupclose', function () { setActive(null); });
    m.on('click', function () { if (phone.matches) setSheet('peek'); });
    markers.set(p.id, m);
  });
  phone.addEventListener('change', function () {
    markers.forEach(function (m) { m.getPopup().options.autoPanPaddingBottomRight = popBottom(); });
    setSheet('peek');
  });

  var activeId = null;
  function setActive(id) {
    if (activeId != null) {
      var o = markers.get(activeId);
      if (o && o._icon) o._icon.classList.remove('is-active');
    }
    activeId = id;
    if (id != null) {
      var m = markers.get(id);
      if (m && m._icon) m._icon.classList.add('is-active');
    }
    document.querySelectorAll('.item').forEach(function (el) {
      var cur = String(el.dataset.id) === String(id);
      if (cur) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current');
    });
    if (id != null && !phone.matches) {
      var cur = document.querySelector('.item[aria-current="true"]');
      if (cur) cur.scrollIntoView({ block: 'nearest' });
    }
  }
  cluster.on('animationend', function () { if (activeId != null) setActive(activeId); });

  /* ---------- sheet (phones) ---------- */
  var panel = $('panel'), handle = $('handle');
  var pendingFit = false;
  function setSheet(s) {
    panel.dataset.sheet = s;
    handle.setAttribute('aria-expanded', String(s === 'open'));
    if (s === 'peek' && pendingFit) { pendingFit = false; setTimeout(function () { fitTo(compute().list); }, 320); }
  }
  handle.addEventListener('click', function () { setSheet(panel.dataset.sheet === 'open' ? 'peek' : 'open'); });

  /* ---------- filtering + rendering ---------- */
  function tokens() { return norm(state.q).split(/\s+/).filter(Boolean); }
  function matchText(p, t) { return t.every(function (x) { return p.hay.indexOf(x) !== -1; }); }

  function compute() {
    var t = tokens();
    var searched = places.filter(function (p) { return matchText(p, t); });
    var catOk = function (p) { return !state.cats.size || state.cats.has(p.cat); };
    var regOk = function (p) { return state.region === 'all' || p.region === state.region; };
    return {
      list: searched.filter(function (p) { return catOk(p) && regOk(p); }),
      catCounts: count(searched.filter(regOk), 'cat'),
      regCounts: count(searched.filter(catOk), 'region')
    };
  }
  function count(arr, key) { var o = {}; arr.forEach(function (p) { o[p[key]] = (o[p[key]] || 0) + 1; }); return o; }

  var chipEls = {}, regEls = {};
  DATA.categories.forEach(function (c) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip cat-' + c.id; b.title = c.hint;
    b.innerHTML = '<span class="dot"></span><span>' + esc(c.label) + '</span><span class="n"></span>';
    b.addEventListener('click', function () {
      if (state.cats.has(c.id)) state.cats.delete(c.id); else state.cats.add(c.id);
      render(true);
    });
    $('chips').appendChild(b); chipEls[c.id] = b;
  });
  [['all', 'All']].concat(DATA.regions.map(function (r) { return [r, r]; })).forEach(function (r) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'region';
    b.innerHTML = esc(r[1]) + '<span class="n"></span>';
    b.addEventListener('click', function () { state.region = r[0]; render(true); });
    $('regions').appendChild(b); regEls[r[0]] = b;
  });

  function render(fit) {
    var r = compute(), list = r.list;

    var total = 0;
    DATA.categories.forEach(function (c) {
      var n = r.catCounts[c.id] || 0, el = chipEls[c.id], on = state.cats.has(c.id);
      el.setAttribute('aria-pressed', String(on));
      el.querySelector('.n').textContent = n;
      el.disabled = n === 0 && !on;
    });
    DATA.regions.forEach(function (rg) { total += r.regCounts[rg] || 0; });
    regEls.all.setAttribute('aria-pressed', String(state.region === 'all'));
    regEls.all.querySelector('.n').textContent = total;
    DATA.regions.forEach(function (rg) {
      var n = r.regCounts[rg] || 0, el = regEls[rg];
      el.setAttribute('aria-pressed', String(state.region === rg));
      el.querySelector('.n').textContent = n;
      el.disabled = n === 0 && state.region !== rg;
    });

    var filtersOn = state.q.trim() || state.cats.size || state.region !== 'all';
    $('clear').hidden = !filtersOn;
    $('count').textContent = list.length + (list.length === 1 ? ' place' : ' places') + (filtersOn ? ' match' : '');
    $('total').textContent = places.length + ' places';

    var ul = $('list'), frag = document.createDocumentFragment(), lastRegion = null;
    ul.textContent = '';
    if (!list.length) {
      var li = document.createElement('li');
      li.className = 'empty';
      li.innerHTML = '<strong>Nothing matches</strong>Try a shorter search, or switch off a category.';
      frag.appendChild(li);
    }
    list.forEach(function (p) {
      if (state.region === 'all' && p.region !== lastRegion) {
        var h = document.createElement('li');
        h.className = 'group'; h.textContent = p.region; lastRegion = p.region;
        frag.appendChild(h);
      }
      var li2 = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'item cat-' + p.cat; b.dataset.id = p.id;
      b.innerHTML = '<span class="dot"></span><span class="item-body"><span class="item-name">' + esc(p.name) + '</span>' +
        (p.sub ? '<span class="item-sub">' + esc(p.sub) + '</span>' : '') +
        (p.note ? '<span class="item-note">' + esc(p.note) + '</span>' : '') +
        '<span class="item-tag">' + esc(catById[p.cat].label) + '</span></span>';
      b.addEventListener('click', function () { select(p.id); });
      li2.appendChild(b); frag.appendChild(li2);
    });
    ul.appendChild(frag);
    ul.scrollTop = 0;

    cluster.clearLayers();
    cluster.addLayers(list.map(function (p) { return markers.get(p.id); }));
    if (activeId != null && !list.some(function (p) { return p.id === activeId; })) { map.closePopup(); setActive(null); }
    else if (activeId != null) setActive(activeId);

    if (fit) fitTo(list);
  }

  function sheetPad() { return phone.matches ? panel.dataset.sheet === 'open' ? Math.round(window.innerHeight * .78) : 166 : 0; }
  function fitTo(list) {
    if (!list.length) return;
    if (phone.matches && panel.dataset.sheet === 'open') { pendingFit = true; return; }
    if (list.length === 1) { map.setView([list[0].lat, list[0].lng], 15, { animate: !reduced }); return; }
    var b = L.latLngBounds(list.map(function (p) { return [p.lat, p.lng]; }));
    map.fitBounds(b, { paddingTopLeft: [32, 56], paddingBottomRight: [32, 32 + sheetPad()], maxZoom: 14.5, animate: !reduced });
  }

  function select(id) {
    var p = byId.get(id), m = markers.get(id);
    if (!p || !m) return;
    pendingFit = false;
    if (phone.matches) setSheet('peek');
    var z = Math.max(map.getZoom(), 15);   /* pins never cluster from zoom 15 */
    var target = L.latLng(p.lat, p.lng);
    var open = function () {
      if (map.hasLayer(m)) m.openPopup();
      else cluster.zoomToShowLayer(m, function () { m.openPopup(); });
    };
    if (map.getZoom() === z && map.getCenter().distanceTo(target) < 5) { open(); return; }
    map.once('moveend', function () { setTimeout(open, 80); });
    map.setView(target, z, { animate: !reduced });
  }

  var timer = null;
  $('q').addEventListener('input', function (e) {
    state.q = e.target.value;
    render(false);
    clearTimeout(timer);
    timer = setTimeout(function () { fitTo(compute().list); }, 300);
  });
  $('q').addEventListener('focus', function () { if (phone.matches) setSheet('open'); });
  $('clear').addEventListener('click', function () {
    state.q = ''; state.cats.clear(); state.region = 'all'; $('q').value = '';
    render(true);
  });

  render(false);
  fitTo(places);
  window.addEventListener('load', function () { map.invalidateSize(); });
})();
</script>

</html>
